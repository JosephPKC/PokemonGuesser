apiVersion: apps/v1
kind: Deployment
metadata:
  name: pkm-web-depl
  namespace: pkm-guess
  labels:
    name: "pkm-web"
  annotations:
    keel.sh/policy: force
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pkm-web
  template:
    metadata:
      labels:
        app: pkm-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pkm-web
          image: localhost:5000/pkm-web:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 0.5
              ephemeral-storage: 1Gi
              memory: 512Mi
            limits:
              memory: 512Mi 
          ports: 
            - containerPort: 80 # Port for this specific container

---

apiVersion: v1
kind: Service
metadata:
  name: pkm-web-serv
  namespace: pkm-guess
spec:
  type: ClusterIP
  selector:
    app: pkm-web
  ports:
    - name: pkm-web
      protocol: TCP
      port: 80 # The Service listens on this port.
      targetPort: 80 # The Service maps data from the above port to this port, which is where the actual app is.

---

