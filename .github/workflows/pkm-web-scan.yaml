name: SonarQube
run-name: Run SonarQube analysis for PR ( ${{ github.event.number }} ${{ github.event.pull_request.title }}) by ${{ github.actor }}
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths: 
      - 'PkmWeb/**'
  
jobs:
  sonar-qube-analysis:
    uses: ./.github/workflows/sonarqube-scan.yaml
    with:
      sln-file-path: ./PkmWeb/PkmWeb.sln
      test-dll-file-path: ./PkmWeb/PkmWeb.Test/bin/Debug/net9.0/PkmWeb.Test.dll
    secrets: inherit