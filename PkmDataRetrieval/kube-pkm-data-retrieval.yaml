apiVersion: apps/v1
kind: Deployment
metadata:
  name: pkm-data-retrieval-depl
  namespace: pkm-guess
  labels:
    name: "pkm-data-retrieval"
  annotations:
    keel.sh/policy: force
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pkm-data-retrieval
  template:
    metadata:
      labels:
        app: pkm-data-retrieval
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pkm-data-retrieval
          image: josephpkc/pkm-data-retrieval:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 0.5
              ephemeral-storage: 1Gi
              memory: 512Mi
            limits:
              memory: 512Mi 
          ports: 
            - containerPort: 8080 # Port for this specific container

---

apiVersion: v1
kind: Service
metadata:
  name: pkm-data-retrieval-serv
  namespace: pkm-guess
spec:
  type: NodePort
  selector:
    app: pkm-data-retrieval
  ports:
    - name: pkm-data-retrieval
      protocol: TCP
      port: 8080 # The Service listens on this port.
      targetPort: 8080 # The Service maps data from the above port to this port, which is where the actual app is.
