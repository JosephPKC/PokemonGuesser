apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: pkm-guess
  labels:
    app: redis
    
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
   name: redis-pvc
   namespace: pkm-guess
   labels:
    app: redis
spec:
   accessModes:
   - ReadWriteOnce
   resources:
    requests:
      storage: 1Gi
      
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-stack
  namespace: pkm-guess
spec:
  serviceName: "redis-serv"
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: redis/redis-stack:latest
        imagePullPolicy: IfNotPresent 
        resources:
            requests:
              cpu: 1
              ephemeral-storage: 1Gi
              memory: 1Gi
            limits:
              memory: 1Gi 
        ports:
        - containerPort: 6379
          name: redis-stack
        volumeMounts:
        - name: redis
          mountPath: /etc/redis/
      volumes:
      - name: redis
        persistentVolumeClaim:
          claimName: redis-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: redis-serv
  namespace: pkm-guess
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
  clusterIP: None
  
---

apiVersion: v1
kind: Service
metadata:
  name: redis-serv-ext
  namespace: pkm-guess
  labels:
    app: redis
spec:
  type: NodePort
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 8000
      targetPort: 6379
  