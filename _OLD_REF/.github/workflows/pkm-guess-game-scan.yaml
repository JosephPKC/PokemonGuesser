name: SonarQube
run-name: Run SonarQube analysis for PR ( ${{ github.event.number }} ${{ github.event.pull_request.title }}) by ${{ github.actor }}
on:
  pull_request:
    types: 
      - opened
      - reopened
      - synchronize
    paths: 
      - 'PkmGuessGame/**'
  
jobs:
  sonar-qube-analysis:
    uses: ./.github/workflows/sonarqube-scan.yaml
    with:
      sln-file-path: ./PkmGuessGame/PkmGuessGame.sln
      test-dll-file-path: ./PkmGuessGame/PkmGuessGame.Test/bin/Debug/net9.0/PkmGuessGame.Test.dll
    secrets: inherit