apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbit-mq
  namespace: pkm-guess
  labels:
    app: rabbit-mq
spec:
  replicas: 1
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 1
      memory: 1Gi
  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_peer_discovery_k8s
      
---

apiVersion: v1
kind: Service
metadata:
  name: rabbit-mq-serv-ext
  namespace: pkm-guess
  labels:
    app: rabbit-mq
spec:
  type: NodePort
  selector:
    app: rabbit-mq
  ports:
    - name: rabbit-mq
      protocol: TCP
      port: 8001
      targetPort: 5672
  